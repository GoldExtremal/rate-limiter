name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: make check
        run: make check
      - name: compose logs
        if: failure()
        run: docker compose logs --no-color
      - name: down
        if: always()
        run: make down
