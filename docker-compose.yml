name: rate-limiter

x-database-url: &database-url "${DATABASE_URL:-postgresql://ratelimiter:${POSTGRES_PASSWORD:-local-dev-only}@postgres:5432/ratelimiter}"

x-app-environment: &app-environment
  DATABASE_URL: *database-url
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  RATE_LIMIT: ${RATE_LIMIT:-100}
  WINDOW_SEC: ${WINDOW_SEC:-60}
  FAIL_MODE_OPEN: ${FAIL_MODE_OPEN:-true}
  REDIS_TIMEOUT_MS: ${REDIS_TIMEOUT_MS:-500}
  REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-64}
  REDIS_QUEUE_TIMEOUT_MS: ${REDIS_QUEUE_TIMEOUT_MS:-1000}
  BREAKER_FAILURE_THRESHOLD: ${BREAKER_FAILURE_THRESHOLD:-5}
  BREAKER_COOLDOWN_SEC: ${BREAKER_COOLDOWN_SEC:-5}
  BREAKER_WINDOW_SEC: ${BREAKER_WINDOW_SEC:-10}
  BREAKER_MIN_CALLS: ${BREAKER_MIN_CALLS:-10}
  BREAKER_FAILURE_RATIO: ${BREAKER_FAILURE_RATIO:-0.5}
  LIMITS_QUERY_TIMEOUT_MS: ${LIMITS_QUERY_TIMEOUT_MS:-1000}
  LIMITS_REFRESH_SEC: ${LIMITS_REFRESH_SEC:-10}
  PROTECTED_PATHS: '["/demo"]'
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-app: &app
  build:
    context: .
    target: runtime
  depends_on:
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
    interval: 3s
    timeout: 3s
    retries: 20
    start_period: 3s
  restart: unless-stopped

services:
  redis:
    image: redis:8.10-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ratelimiter
      POSTGRES_USER: ratelimiter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ratelimiter -d ratelimiter"]
      interval: 2s
      timeout: 2s
      retries: 30

  migrate:
    build:
      context: .
      target: runtime
    command: ["python", "-m", "app.migrate"]
    environment:
      DATABASE_URL: *database-url
      SEED_CLIENT_LIMITS: '{"client-a": 500, "client-b": 50, "client-c": 1000}'
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app1:
    <<: *app
    environment:
      <<: *app-environment
      INSTANCE_ID: app1
    ports:
      - "127.0.0.1:${APP1_PORT:-8001}:8000"

  app2:
    <<: *app
    environment:
      <<: *app-environment
      INSTANCE_ID: app2
    ports:
      - "127.0.0.1:${APP2_PORT:-8002}:8000"

  nginx:
    image: nginx:1.31-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    restart: unless-stopped

  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment: &test-environment
      NGINX_URL: http://nginx
      APP_URLS: http://app1:8000,http://app2:8000
      TEST_REDIS_URL: redis://redis:6379/15
      APP_REDIS_URL: redis://redis:6379/0
      TEST_DATABASE_URL: postgresql://ratelimiter:${POSTGRES_PASSWORD:-local-dev-only}@postgres:5432/ratelimiter_test

  toxiproxy:
    profiles: ["test"]
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./toxiproxy.json:/config/toxiproxy.json:ro

  chaos:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      <<: *test-environment
      CHAOS_COMPOSE_PROJECT: rate-limiter
      TOXIPROXY_URL: http://toxiproxy:8474
      PROXIED_REDIS_URL: redis://toxiproxy:26379/15
      PROXIED_DATABASE_URL: postgresql://ratelimiter:${POSTGRES_PASSWORD:-local-dev-only}@toxiproxy:25432/ratelimiter_test
    depends_on:
      - toxiproxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  locust:
    profiles: ["load"]
    image: locustio/locust:2.46.6
    working_dir: /mnt/locust
    volumes:
      - ./load:/mnt/locust
    environment:
      LOAD_USER_RPS: ${LOAD_USER_RPS:-10}
    command:
      - -f
      - locustfile.py
      - --headless
      - --host=http://nginx
      - --users=${LOAD_USERS:-150}
      - --spawn-rate=${LOAD_SPAWN_RATE:-5}
      - --run-time=${LOAD_RUN_TIME:-150s}
      - --reset-stats
      - --processes=${LOAD_PROCESSES:-4}
      - --csv=reports/locust
      - --html=reports/locust.html
      - --only-summary

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.5.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-dev-only}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/rate-limiter.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
