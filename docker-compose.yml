name: rate-limiter

x-app-environment: &app-environment
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  RATE_LIMIT: ${RATE_LIMIT:-100}
  WINDOW_SEC: ${WINDOW_SEC:-60}
  REDIS_TIMEOUT_MS: ${REDIS_TIMEOUT_MS:-500}
  REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-64}
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-app: &app
  build:
    context: .
    target: runtime
  depends_on:
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
    interval: 3s
    timeout: 3s
    retries: 20
    start_period: 3s
  restart: unless-stopped

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  app1:
    <<: *app
    environment:
      <<: *app-environment
      INSTANCE_ID: app1
    ports:
      - "127.0.0.1:${APP1_PORT:-8001}:8000"

  app2:
    <<: *app
    environment:
      <<: *app-environment
      INSTANCE_ID: app2
    ports:
      - "127.0.0.1:${APP2_PORT:-8002}:8000"

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    restart: unless-stopped

  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      NGINX_URL: http://nginx
      APP_URLS: http://app1:8000,http://app2:8000
      TEST_REDIS_URL: redis://redis:6379/15
