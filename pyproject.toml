[project]
name = "rate-limiter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "prometheus-client>=0.21",
    "pydantic-settings>=2.6",
    "redis[hiredis]>=5.2",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1",
    "asyncpg-stubs>=0.31.3",
    "docker>=7.1",
    "httpx>=0.28",
    "hypothesis>=6.120",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"load/**" = ["S311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["slow: тесты, ждущие полное окно 60 с"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"
files = ["app"]
strict = true
