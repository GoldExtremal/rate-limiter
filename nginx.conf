worker_processes auto;

events {
  worker_connections 4096;
}

http {
  resolver 127.0.0.11 valid=5s ipv6=off;

  upstream app {
    zone app 64k;
    server app1:8000 resolve max_fails=1 fail_timeout=5s;
    server app2:8000 resolve max_fails=1 fail_timeout=5s;
    keepalive 64;
    keepalive_timeout 60s;
  }

  server {
    listen 80;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;

    location = /check {
      proxy_next_upstream off;
      proxy_pass http://app;
    }

    location = /demo {
      proxy_next_upstream off;
      proxy_pass http://app;
    }

    location / {
      proxy_pass http://app;
    }
  }
}
